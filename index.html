




<!DOCTYPE html>



<html lang="en">



<head>



<meta charset="UTF-8">



<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">



<title>Max's Monster Truck Mayhem V2</title>



<style>



*{box-sizing:border-box}



html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#76caff;font-family:Arial,sans-serif;touch-action:none}



canvas{display:block;width:100vw;height:100vh}



#hud{position:fixed;top:10px;left:12px;color:white;font-size:18px;font-weight:900;text-shadow:2px
2px 3px #333;pointer-events:none}



#jump{position:fixed;bottom:18px;right:20px;width:108px;height:108px;border:5px
solid
white;border-radius:50%;background:linear-gradient(#ff4747,#bc0000);color:white;font-size:23px;font-weight:900;box-shadow:0
5px 0 #730000;touch-action:none}



#jump:active{transform:translateY(4px)}



#restart{display:none;position:fixed;top:56%;left:50%;transform:translate(-50%,-50%);background:#e52222;color:white;border:4px
solid white;border-radius:16px;padding:15px
28px;font-size:22px;font-weight:bold}



#message{display:none;position:fixed;top:28%;width:100%;text-align:center;color:white;font-size:35px;font-weight:900;text-shadow:3px
3px #222}



#rotate{display:none;position:fixed;inset:0;background:#111;color:white;align-items:center;justify-content:center;text-align:center;padding:25px;font-size:25px;z-index:10}



@media(orientation:portrait){#rotate{display:flex}}



</style>



</head>



<body>



<canvas id="game"></canvas>



<div id="hud">MAX MAYHEM | SCORE:
0</div>



<button id="jump">JUMP!</button>



<div id="message">GAME OVER!</div>



<button id="restart">TRY
AGAIN</button>



<div id="rotate">Rotate your phone sideways
to play!</div>



<script>



const c=document.getElementById("game");



const g=c.getContext("2d");



const hud=document.getElementById("hud");



const jumpBtn=document.getElementById("jump");



const
restartBtn=document.getElementById("restart");



const message=document.getElementById("message");



 



let w,h,ground,dist,speed,score,dead,items,spawnAt;



const truck={x:80,y:0,vy:0,air:false,angle:0};



 



function resize(){



w=c.width=innerWidth;



h=c.height=innerHeight;



ground=h*.73;



truck.x=Math.max(55,w*.18);



if(!dist)truck.y=ground-54;



}



onresize=resize;



 



function reset(){



dist=0;speed=4.5;score=0;dead=false;



items=[];spawnAt=480;



truck.vy=0;truck.air=false;truck.angle=0;



truck.y=ground-54;



message.style.display="none";



restartBtn.style.display="none";



jumpBtn.style.display="block";



}



resize();



reset();



 



function jump(){



if(!dead&&!truck.air){



truck.vy=-12.8;



truck.air=true;



}



}



jumpBtn.onpointerdown=e=>{e.preventDefault();jump()};



onkeydown=e=>{if(e.code==="Space"||e.code==="ArrowUp")jump()};



restartBtn.onclick=reset;



 



function wheel(x,y,r){



g.fillStyle="#111";



g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill();



g.strokeStyle="#444";g.lineWidth=5;



g.beginPath();g.arc(x,y,r-5,0,Math.PI*2);g.stroke();



g.fillStyle="#c9c9c9";



g.beginPath();g.arc(x,y,9,0,Math.PI*2);g.fill();



g.fillStyle="#555";



g.beginPath();g.arc(x,y,4,0,Math.PI*2);g.fill();



}



 



function drawTruck(){



g.save();



g.translate(truck.x+65,truck.y+22);



g.rotate(truck.angle);



g.translate(-65,-22);



 



g.fillStyle="#292929";



g.fillRect(10,19,110,14);



g.strokeStyle="#ddd";g.lineWidth=5;



g.beginPath();



g.moveTo(26,28);g.lineTo(27,43);



g.moveTo(102,28);g.lineTo(102,43);



g.stroke();



 



g.fillStyle="#aaa";



g.fillRect(88,-27,8,34);



g.fillRect(103,-24,8,32);



g.fillStyle="#555";



g.fillRect(87,-29,10,5);



g.fillRect(102,-26,10,5);



 



let paint=g.createLinearGradient(0,-20,125,40);



paint.addColorStop(0,"#890000");



paint.addColorStop(.45,"#ff3333");



paint.addColorStop(1,"#a90000");



g.fillStyle=paint;



g.beginPath();



g.moveTo(0,5);



g.lineTo(33,0);



g.lineTo(48,-24);



g.lineTo(86,-24);



g.lineTo(105,0);



g.lineTo(125,7);



g.lineTo(120,31);



g.lineTo(0,31);



g.closePath();g.fill();



 



g.fillStyle="#bceaff";



g.beginPath();



g.moveTo(52,-20);g.lineTo(82,-20);



g.lineTo(96,-3);g.lineTo(47,-3);



g.closePath();g.fill();



 



g.fillStyle="#ffcb17";



g.beginPath();



g.moveTo(5,15);g.lineTo(33,7);



g.lineTo(24,18);g.lineTo(46,11);



g.lineTo(30,27);g.closePath();g.fill();



 



g.fillStyle="white";g.font="900 18px
Arial";



g.fillText("MAX",52,23);



 



g.fillStyle="#ffe678";



g.fillRect(119,9,6,9);



wheel(26,38,24);



wheel(103,38,24);



g.restore();



}



 



function drawBackground(){



let sky=g.createLinearGradient(0,0,0,ground);



sky.addColorStop(0,"#4ab9ff");



sky.addColorStop(1,"#d8f3ff");



g.fillStyle=sky;g.fillRect(0,0,w,ground);



 



g.fillStyle="#ffdf59";



g.beginPath();g.arc(w*.82,h*.18,33,0,7);g.fill();



 



g.fillStyle="#83ac61";



for(let x=-250-(dist*.13%250);x<w+250;x+=250){



g.beginPath();



g.moveTo(x,ground);



g.lineTo(x+125,ground-105);



g.lineTo(x+250,ground);



g.fill();



}



g.fillStyle="#80502a";



g.fillRect(0,ground,w,h-ground);



g.fillStyle="#b57a42";



g.fillRect(0,ground,w,13);



g.fillStyle="#59341d";



for(let x=-(dist%75);x<w;x+=75){



g.fillRect(x,ground+45,42,5);



}



}



 



function drawItem(o){



const x=o.x;



if(o.type==="ramp"){



g.fillStyle="#75401f";



g.beginPath();



g.moveTo(x,ground);



g.lineTo(x+110,ground-43);



g.lineTo(x+150,ground-43);



g.lineTo(x+150,ground);



g.closePath();g.fill();



g.strokeStyle="#c08a4a";g.lineWidth=5;



g.beginPath();



g.moveTo(x,ground);



g.lineTo(x+110,ground-43);



g.lineTo(x+150,ground-43);



g.stroke();



}else if(o.type==="crate"){



g.fillStyle="#a86a32";



g.fillRect(x,ground-38,36,38);



g.strokeStyle="#573012";g.lineWidth=4;



g.strokeRect(x,ground-38,36,38);



g.beginPath();



g.moveTo(x,ground-38);



g.lineTo(x+36,ground);



g.moveTo(x+36,ground-38);



g.lineTo(x,ground);



g.stroke();



}else{



g.fillStyle="#353535";



g.beginPath();g.arc(x+19,ground-19,19,0,7);g.fill();



g.fillStyle="#777";



g.beginPath();g.arc(x+19,ground-19,9,0,7);g.fill();



}



}



 



function crash(){



dead=true;



message.style.display="block";



restartBtn.style.display="block";



jumpBtn.style.display="none";



}



 



function update(){



if(dead)return;



 



dist+=speed;



score=Math.floor(dist/10);



speed=Math.min(7.5,4.5+score/650);



hud.textContent="MAX MAYHEM | SCORE: "+score;



 



// Generate alternating flat obstacles and ramps



if(dist+w>spawnAt){



let type;



if(items.length<2)type="ramp";



else
type=Math.random()<.45?"ramp":(Math.random()<.5?"crate":"tyre");



items.push({x:spawnAt-dist,type:type});



spawnAt+=type==="ramp"?440:350+Math.random()*130;



}



 



// Move items with scrolling world



let surface=ground;



for(const o of items){



o.x-=speed;



if(o.type==="ramp"){



const front=truck.x+103;



const p=(front-o.x)/110;



if(p>=0&&p<=1&&truck.vy>=0){



surface=Math.min(surface,ground-43*p);



}



if(p>1&&p<1.36&&truck.vy>=0){



surface=Math.min(surface,ground-43);



}



}else{



const left=o.x+5,right=o.x+33;



const truckLeft=truck.x+15;



const truckRight=truck.x+110;



const truckBottom=truck.y+54;



if(truckRight>left&&truckLeft<right&&truckBottom>ground-30){



crash();



}



}



}



items=items.filter(o=>o.x>-200);



 



// Gravity and ramp landing



truck.vy+=.65;



truck.y+=truck.vy;



if(truck.y+54>=surface){



truck.y=surface-54;



truck.vy=0;



truck.air=false;



}else{



truck.air=true;



}



truck.angle=truck.air?-.08:truck.angle*.8;



}



 



function frame(){



drawBackground();



for(const o of items)drawItem(o);



drawTruck();



update();



requestAnimationFrame(frame);



}



frame();



</script>



</body>



</html>
