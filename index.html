
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Max Monster Truck Mayhem</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#75caff;font-family:Arial;touch-action:none}
canvas{display:block;width:100vw;height:100vh}
#jump{position:fixed;bottom:15px;right:20px;background:#e21c20;color:white;border:4px solid white;border-radius:50%;width:105px;height:105px;font-size:23px;font-weight:bold;touch-action:none}
#score{position:fixed;top:12px;left:15px;color:white;font-size:20px;font-weight:bold;text-shadow:2px 2px #333}
#rotate{display:none;position:fixed;inset:0;background:#111;color:white;align-items:center;justify-content:center;text-align:center;font-size:24px;padding:25px}
@media(orientation:portrait){#rotate{display:flex}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="score">MAX MAYHEM | 0</div>
<button id="jump">JUMP!</button>
<div id="rotate">Rotate your phone sideways to play!</div>
<script>
const c=document.getElementById("game"),g=c.getContext("2d");
let w,h,ground,x=80,y=0,vy=0,air=false,dist=0,ramps=[];
function resize(){w=c.width=innerWidth;h=c.height=innerHeight;ground=h*.72;if(!dist)y=ground-48}
onresize=resize;resize();
function jump(){if(!air){vy=-13;air=true}}
document.getElementById("jump").onpointerdown=e=>{e.preventDefault();jump()};
onkeydown=e=>{if(e.code==="Space")jump()};
function wheel(a,b){g.fillStyle="#111";g.beginPath();g.arc(a,b,19,0,7);g.fill();g.fillStyle="#aaa";g.beginPath();g.arc(a,b,8,0,7);g.fill()}
function truck(){
g.fillStyle="#222";g.fillRect(x+8,y+22,104,12);
g.fillStyle="#d71920";g.beginPath();g.moveTo(x,y+10);g.lineTo(x+30,y+7);g.lineTo(x+45,y-15);g.lineTo(x+85,y-15);g.lineTo(x+103,y+8);g.lineTo(x+120,y+13);g.lineTo(x+115,y+35);g.lineTo(x,y+35);g.fill();
g.fillStyle="#9be4ff";g.fillRect(x+49,y-10,31,15);
g.fillStyle="white";g.font="bold 17px Arial";g.fillText("MAX",x+47,y+28);
g.fillStyle="#bbb";g.fillRect(x+91,y-27,7,28);g.fillRect(x+103,y-24,7,25);
wheel(x+24,y+38);wheel(x+99,y+38)
}
function frame(){
g.fillStyle="#78caff";g.fillRect(0,0,w,h);
g.fillStyle="#ffe36a";g.beginPath();g.arc(w*.8,h*.18,30,0,7);g.fill();
g.fillStyle="#78a95a";
for(let i=-250-(dist*.15%250);i<w+250;i+=250){g.beginPath();g.moveTo(i,ground);g.lineTo(i+125,ground-100);g.lineTo(i+250,ground);g.fill()}
g.fillStyle="#86502b";g.fillRect(0,ground,w,h-ground);
g.fillStyle="#aa713d";g.fillRect(0,ground,w,12);
g.fillStyle="#59351d";
for(let i=-(dist%75);i<w;i+=75)g.fillRect(i,ground+45,40,5);
if(!ramps.length)ramps=[{x:w+200},{x:w+650},{x:w+1100}];
let surface=ground;
for(const r of ramps){
r.x-=5;
g.fillStyle="#75401e";g.beginPath();g.moveTo(r.x,ground);g.lineTo(r.x+115,ground-42);g.lineTo(r.x+150,ground-42);g.lineTo(r.x+150,ground);g.fill();
let p=(x+90-r.x)/115;
if(p>=0&&p<=1&&vy>=0)surface=Math.min(surface,ground-42*p);
if(p>1&&p<1.3&&vy>=0)surface=Math.min(surface,ground-42);
}
if(ramps[0].x < -180){ramps.shift();ramps.push({x:ramps[ramps.length-1].x+450})}
vy+=.65;y+=vy;
if(y+48>=surface){y=surface-48;vy=0;air=false}else air=true;
truck();dist+=5;
document.getElementById("score").textContent="MAX MAYHEM | "+Math.floor(dist/10);
requestAnimationFrame(frame)
}
frame();
</script>
</body>
</html>
